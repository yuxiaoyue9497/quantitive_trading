[project]
name = "quantitive-trading"
version = "0.1.0"
description = "A 股量化策略回测框架，支持双均线策略、手续费建模、向量化回测与绩效分析"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "baostock>=0.8.8",
    "pandas",
    "numpy",
    "matplotlib",
]
[project.optional-dependencies]
akshare = ["akshare>=1.11"]
tushare = ["tushare>=1.2.89"]
extra = ["akshare>=1.11", "tushare>=1.2.89"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["data_fetch*"]

[project.scripts]
data-fetch = "data_fetch.cli:main"

[tool.uv.sources]
